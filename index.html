<script>
(function(){
function mark(){var p=location.pathname.replace(/\/+$/,'')||'/';var a=document.querySelectorAll('.wv2-navlink');for(var i=0;i<a.length;i++){var h=(a[i].getAttribute('href')||'/').replace(/\/+$/,'')||'/';var on=h==='/'?p==='/':(p===h||p.indexOf(h+'/')===0);if(a[i].classList.contains('wv2-here')!==on)a[i].classList.toggle('wv2-here',on);}}
function keep(){var e=document.querySelectorAll('.wv2-letter em');for(var i=0;i<e.length;i++){var k=i===e.length-1;if(e[i].classList.contains('wv2-keep')!==k)e[i].classList.toggle('wv2-keep',k);}}
function hero(){var p=document.querySelector('.wv2-portrait');if(!p)return;var G='/gaze-portrait.svg';if(p.getAttribute('data-ph')!==G){p.setAttribute('data-ph',G);p.src=G;p.removeAttribute('srcset');}if(!p.classList.contains('wv2-hero-ph'))p.classList.add('wv2-hero-ph');}
function start(){mark();keep();hero();new MutationObserver(function(){mark();keep();hero();}).observe(document.getElementById('root'),{childList:true,subtree:true});window.addEventListener('popstate',mark);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
